[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shellie"
version = "0.1.0"
description = "Shellie — local CLI assistant for shell, files, and research, with session and Cognee memory."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain",
    "langchain-community",
    "langchain-openai",
    "langchain-anthropic",
    "langchain-google-genai",
    "wikipedia",
    "ddgs",
    "langgraph-checkpoint-sqlite",
    "python-dotenv",
    "pydantic",
    "ruff",
    "httpx",
    "beautifulsoup4",
    "pyyaml",
]

[project.optional-dependencies]
cognee = ["cognee"]
# mcp SDK v2 removed mcp.shared.context.RequestContext; langchain-mcp-adapters
# still imports the v1 symbol — keep mcp on 1.x until adapters catch up.
mcp = [
    "langchain-mcp-adapters",
    "mcp>=1,<2",
]
lint = ["yamllint"]

[project.scripts]
shellie = "shellie.cli:main"
shellie-mcp = "shellie.mcp.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["shellie*"]

[tool.setuptools.package-data]
shellie = ["lint_configs/*", "skills/builtin/**"]
